name: CI

on:
  push:
    branches: [main, preview]
  pull_request:

# Cancel in-progress runs for the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforces the branching model: feature branches merge into `preview`, and
  # `preview` is the only branch allowed to open a pull request into `main`.
  # GitHub rulesets cannot restrict a pull request's *head* branch, so the check
  # lives here and is what the `main` ruleset marks as required.
  base-branch:
    name: Base branch policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Only `preview` may target `main`
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = "main" ] && [ "$HEAD" != "preview" ]; then
            echo "::error::PRs into 'main' may only come from 'preview' (this one is from '$HEAD'). Retarget it at 'preview'."
            exit 1
          fi
          echo "OK: '$HEAD' -> '$BASE'"

  verify:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generate the Prisma client so type-only imports from
      # `app/generated/prisma` resolve. `generate` reads the schema only and
      # does not need a database connection.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
