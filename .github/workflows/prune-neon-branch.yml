name: Prune Neon preview branch

# The Neon–Vercel integration creates a `preview/<git-branch>` Neon branch the
# first time a git branch is deployed, but never removes it. The org is on the
# free plan (10 branches); once the cap is reached the integration cannot
# provision and previews fail with `Resource provisioning failed` *before* the
# build runs. This deletes a PR's branch when the PR closes.
#
# Requires a `NEON_API_KEY` repository secret. Without it the job logs and
# exits 0 rather than failing every closed PR.

on:
  pull_request:
    types: [closed]

jobs:
  prune:
    name: Delete preview/<head-ref>
    runs-on: ubuntu-latest
    steps:
      - name: Delete the Neon branch for this PR
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: divine-firefly-20538122
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if [ -z "${NEON_API_KEY}" ]; then
            echo "NEON_API_KEY is not set — skipping prune."
            exit 0
          fi

          target="preview/${HEAD_REF}"
          # Guard: only ever delete branches under the integration's own
          # `preview/` namespace. `main`, `preview` and `development` are
          # long-lived and must survive a stray head ref.
          case "${target}" in
            preview/*) ;;
            *) echo "Refusing to delete '${target}' — not under preview/."; exit 1 ;;
          esac

          api="https://console.neon.tech/api/v2/projects/${NEON_PROJECT_ID}"
          branch_id=$(curl -sSf -H "Authorization: Bearer ${NEON_API_KEY}" \
            "${api}/branches" \
            | jq -r --arg n "${target}" '.branches[] | select(.name == $n) | .id')

          if [ -z "${branch_id}" ]; then
            echo "No Neon branch named '${target}' — nothing to prune."
            exit 0
          fi

          echo "Deleting Neon branch '${target}' (${branch_id})…"
          curl -sSf -X DELETE -H "Authorization: Bearer ${NEON_API_KEY}" \
            "${api}/branches/${branch_id}" > /dev/null
          echo "Deleted. Branches now in use:"
          curl -sSf -H "Authorization: Bearer ${NEON_API_KEY}" "${api}/branches" \
            | jq -r '.branches[].name'
